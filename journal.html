<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>稽古記録一覧 | 演劇同好会</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23141414'/%3E%3Cpath d='M16 42h32M20 22h24M24 22v20M40 22v20' stroke='%23f4efe6' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="description" content="電気通信大学演劇同好会の稽古記録一覧。稽古、制作、告知の記録を掲載します。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=20260628g" />
  </head>
  <body class="archive-page">
    <header class="site-header is-solid" data-header>
      <a class="brand" href="./index.html#top" aria-label="演劇同好会 トップへ">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>演劇同好会</span>
      </a>
      <nav class="nav" aria-label="主要ナビゲーション">
        <a href="./index.html#about">紹介</a>
        <a href="./shows.html">公演</a>
        <a href="./journal.html" aria-current="page">稽古記録</a>
        <a href="./index.html#join">参加</a>
      </nav>
    </header>

    <main class="archive-shell">
      <section class="section archive-hero" aria-labelledby="archive-title">
        <div class="section-heading with-controls">
          <div>
            <span class="label">journal archive</span>
            <h1 id="archive-title">稽古記録</h1>
            <p>稽古場で起きた判断、制作のメモ、告知を時系列で読む。</p>
          </div>
          <div class="segmented" role="tablist" aria-label="稽古記録カテゴリ">
            <button type="button" class="active" data-filter="all" role="tab" aria-selected="true">ALL</button>
            <button type="button" data-filter="稽古" role="tab" aria-selected="false">稽古</button>
            <button type="button" data-filter="役者" role="tab" aria-selected="false">役者</button>
            <button type="button" data-filter="裏方" role="tab" aria-selected="false">裏方</button>
            <button type="button" data-filter="告知" role="tab" aria-selected="false">告知</button>
            <button type="button" data-filter="その他" role="tab" aria-selected="false">その他</button>
          </div>
        </div>

        <div class="archive-layout">
          <div class="archive-feed" data-journal-region>
            <p class="archive-status" data-journal-status aria-live="polite">読み込み中</p>
            <div class="post-grid" data-journal-posts></div>
            <nav class="pagination" data-pagination aria-label="稽古記録ページ"></nav>
          </div>
          <aside class="archive-side" aria-label="おすすめ記事">
            <div class="pickup-panel" data-pickup></div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>演劇同好会</span>
      <a href="./index.html#top">トップへ戻る</a>
    </footer>

    <script src="./journal.js?v=20260628d"></script>
  </body>
</html>
